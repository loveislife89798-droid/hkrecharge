<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Recharge - Mobile & DTH Payments</title>
    <!-- रेज़रपे की मुख्य लाइव स्क्रिप्ट लाइब्रेरी -->
    <script src="https://razorpay.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #172033;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f4f9;
        }
        h1 {
            color: #0b63f6;
            font-size: 28px;
        }
        .tab-container {
            display: flex;
            margin-bottom: 20px;
            background: #f0f4f9;
            border-radius: 8px;
            padding: 5px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            color: #5e6c84;
        }
        .tab.active {
            background: white;
            color: #0b63f6;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        .input-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd4e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #0b63f6;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #0b63f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #084ec2;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #8996a6;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>HK Recharge</h1>
        <p>सुरक्षित और तेज़ मोबाइल एवं DTH रीचार्ज</p>
    </header>

    <!-- टैब विकल्प -->
    <div class="tab-container">
        <div class="tab active" onclick="switchTab('mobile')">मोबाइल रीचार्ज</div>
        <div class="tab" onclick="switchTab('dth')">DTH रीचार्ज</div>
    </div>

    <!-- मोबाइल रीचार्ज फॉर्म -->
    <div id="mobile-section" class="form-section active">
        <div class="input-group">
            <label for="mobileNumber">मोबाइल नंबर दर्ज करें</label>
            <input type="tel" id="mobileNumber" placeholder="10 अंकों का नंबर" maxlength="10">
        </div>
        <div class="input-group">
            <label for="mobileOperator">ऑपरेटर चुनें</label>
            <select id="mobileOperator">
                <option value="">-- ऑपरेटर चुनें --</option>
                <option value="Jio">Jio</option>
                <option value="Airtel">Airtel</option>
                <option value="Vi">Vi (Vodafone Idea)</option>
                <option value="BSNL">BSNL</option>
            </select>
        </div>
        <div class="input-group">
            <label for="mobileAmount">रीचार्ज राशि (₹)</label>
            <input type="number" id="mobileAmount" placeholder="राशि दर्ज करें">
        </div>
        <button onclick="processMobileRecharge()">Recharge करें</button>
    </div>

    <!-- DTH रीचार्ज फॉर्म -->
    <div id="dth-section" class="form-section">
        <div class="input-group">
            <label for="dthNumber">DTH कस्टमर ID / सब्सक्राइबर ID</label>
            <input type="text" id="dthNumber" placeholder="कस्टमर ID दर्ज करें">
        </div>
        <div class="input-group">
            <label for="dthOperator">DTH ऑपरेटर चुनें</label>
            <select id="dthOperator">
                <option value="">-- ऑपरेटर चुनें --</option>
                <option value="Tata Play">Tata Play</option>
                <option value="Airtel Digital TV">Airtel Digital TV</option>
                <option value="Dish TV">Dish TV</option>
                <option value="Videocon d2h">Videocon d2h</option>
                <option value="Sun Direct">Sun Direct</option>
            </select>
        </div>
        <div class="input-group">
            <label for="dthAmount">रीचार्ज राशि (₹)</label>
            <input type="number" id="dthAmount" placeholder="राशि दर्ज करें">
        </div>
        <button onclick="processDthRecharge()">DTH Recharge करें</button>
    </div>

    <footer>
        &copy; 2026 HK Recharge. Powered by Razorpay Secure Gateway.
    </footer>
</div>

<script>
    // टैब बदलने का फ़ंक्शन
    function switchTab(type) {
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
        
        if(type === 'mobile') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('mobile-section').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('dth-section').classList.add('active');
        }
    }

    // मोबाइल रीचार्ज और लाइव रेज़रपे गेटवे फ़ंक्शन
    function processMobileRecharge() {
        var number = document.getElementById("mobileNumber").value;
        var operator = document.getElementById("mobileOperator").value;
        var amount = document.getElementById("mobileAmount").value;

         // टैब बदलने का बिल्कुल सही फ़ंक्शन
    function switchTab(type) {
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
        
        if(type === 'mobile') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('mobile-section').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('dth-section').classList.add('active');
        }
    }
   if (number.length !== 10 || isNaN(number)) {
            alert("कृपया 10 अंकों का सही मोबाइल नंबर डालें।");
            return;
        }
        if (operator === "") {
            alert("कृपया ऑपरेटर चुनें।");
            return;
        }
        if (!amount || amount <= 0) {
            alert("कृपया सही रीचार्ज राशि दर्ज करें।");
            return;
        }

        // लाइव रेज़रपे सेटिंग्स
        var options = {
            "key": "rzp_live_TVw3z0nKLpat5Q", // आपकी लाइव की
            "amount": amount * 100, // पैसे पैसों में बदलते हैं (₹1 = 100 पैसे)
            "currency": "INR",
            "name": "HK Recharge",
            "description": "Mobile Recharge - " + number + " (" + operator + ")",
            "handler": function (response){
                alert("भुगतान सफल रहा!\nTransaction ID: " + response.razorpay_payment_id + "\nआपका रीचार्ज जल्द ही प्रोसेस कर दिया जाएगा।");
            },
            "prefill": {
                "contact": number
            },
            "theme": {
                "color": "#0b63f6"
            }
        };
        var rzp1 = new Razorpay(options);
        rzp1.open();
    }

    // DTH रीचार्ज और लाइव रेज़रपे गेटवे फ़ंक्शन
    function processDthRecharge() {
        var dthId = document.getElementById("dthNumber").value;
        var dthOp = document.getElementById("dthOperator").value;
        var dthAmt = document.getElementById("dthAmount").value;

        if (dthId.trim() === "") {
            alert("कृपया सही कस्टमर ID दर्ज करें।");
            return;
        }
        if (dthOp === "") {
            alert("कृपया DTH ऑपरेटर चुनें।");
            return;
        }
        if (!dthAmt || dthAmt <= 0) {
            alert("कृपया सही रीचार्ज राशि दर्ज करें।");
            return;
        }

        // लाइव रेज़रपे सेटिंग्स (DTH के लिए)
        var options = {
            "key": "rzp_live_TVw3z0nKLpat5Q", // आपकी लाइव की
            "amount": dthAmt * 100,
            "currency": "INR",
            "name": "HK Recharge",
            "description": "DTH Recharge - ID: " + dthId + " (" + dthOp + ")",
            "handler": function (response){
                alert("भुगतान सफल रहा!\nTransaction ID: " + response.razorpay_payment_id + "\nआपका DTH रीचार्ज जल्द ही सक्रिय कर दिया जाएगा।");
            },
            "theme": {
                "color": "#0b63f6"
            }
        };
        var rzp2 = new Razorpay(options);
        rzp2.open();
    }
</script>

</body>
</html>
