<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mhako Recharge - Mobile Plan & Recharge</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            background: white;
            margin: 0 auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #0076ff; margin-bottom: 20px; }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-submit {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            margin-top: 15px;
        }
        .btn-submit:hover { background-color: #218838; }
        #qrSection {
            display: none;
            margin-top: 25px;
            padding: 15px;
            border-top: 2px dashed #ccc;
        }
        #qrCodeImg {
            width: 200px;
            height: 200px;
            margin: 15px auto;
        }
        .status-text {
            color: #d9534f;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Mhako Recharge</h2>
    <p>अपना मोबाइल रिचार्ज करें</p>
    
    <form id="rechargeForm">
        <input type="tel" id="mobileNumber" placeholder="10 अंकों का मोबाइल नंबर" maxlength="10" required pattern="[0-9]{10}">
        
        <select id="operator" required>
            <option value="">सिम ऑपरेटर चुनें</option>
            <option value="Jio">Jio</option>
            <option value="Airtel">Airtel</option>
            <option value="Vi">Vi (Vodafone Idea)</option>
            <option value="BSNL">BSNL</option>
        </select>
        
        <select id="amount" required>
            <option value="">रिचार्ज充 प्लान चुनें</option>
            <option value="239">₹239 (1.5GB/दिन - 28 दिन)</option>
            <option value="299">₹299 (2GB/दिन - 28 दिन)</option>
            <option value="666">₹666 (1.5GB/दिन - 84 दिन)</option>
            <option value="749">₹749 (2GB/दिन - 90 दिन)</option>
        </select>
        
        <input type="submit" class="btn-submit" value="अभी रिचार्ज करें">
    </form>

    <div id="qrSection">
        <h3>भुगतान पूरा करें</h3>
        <p>इस QR कोड को स्कैन करें या अपने पेमेंट ऐप से पे करें:</p>
        <img id="qrCodeImg" src="" alt="Payment QR Code">
        <p class="status-text">⚠️ पेमेंट सफल होने के बाद 5 मिनट में रिचार्ज एक्टिवेट हो जाएगा।</p>
    </div>
</div>

<script>
    document.getElementById('rechargeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        var num = document.getElementById('mobileNumber').value;
        var op = document.getElementById('operator').value;
        var amt = document.getElementById('amount').value;
        
        // 1. अपनी असली UPI ID यहाँ डालें
        var upiId = " 7665498079@ybl
        var name = "Mhako Recharge";
        
        // 2. अपनी टेलीग्राम डिटेल्स यहाँ भरें
        var telegramToken = "YOUR_TELEGRAM_BOT_TOKEN"; 
        var telegramChatId = "YOUR_TELEGRAM_CHAT_ID";   
        
        // टेलीग्राम पर डेटा भेजने का मैसेज फॉर्मेट [1]
        var message = `🔋 *नया रिचार्ज ऑर्डर!*\n\n📱 मोबाइल नंबर: ${num}\n🏢 ऑपरेटर: ${op}\n💰 प्लान राशि: ₹${amt}`;
        
        // टेलीग्राम API पर डेटा सेंड करना [1]
        var telegramUrl = `https://telegram.org{telegramToken}/sendMessage?chat_id=${telegramChatId}&text=${encodeURIComponent(message)}&parse_mode=Markdown`;
        
        fetch(telegramUrl); // बैकग्राउंड में टेलीग्राम पर मैसेज चला जाएगा [1]
        
        // क्यूआर कोड जेनरेट करना
        var upiData = "upi://pay?pa=" + upiId + "&pn=" + encodeURIComponent(name) + "&am=" + amt + "&cu=INR&tn=" + encodeURIComponent(op + "_" + num);
        var qrUrl = "https://qrserver.com" + encodeURIComponent(upiData);
        
        document.getElementById('qrCodeImg').src = qrUrl;
        document.getElementById('qrSection').style.display = "block";
        
        window.location.href = upiData; // बैकअप के लिए सीधा ऐप खोलना
    });
</script>

</body>
</html>
