<script>
function demoRecharge() {
    const number = document.querySelector('input[type="tel"]').value;
    const amount = document.querySelector('input[type="number"]').value;

    if (number.length !== 10) {
        alert("कृपया सही 10 अंकों का मोबाइल नंबर डालें");
        return;
    }

    if (!amount || amount <= 0) {
        alert("कृपया Recharge Amount डालें");
        return;
    }

    alert("Demo Recharge Request सफलतापूर्वक प्राप्त हुई!\n\nMobile: " + number + "\nAmount: ₹" + amount + "\n\nअभी यह Real Recharge नहीं है।");
}
</script>
